buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // The org.flywaydb.flyway plugin loads database support via ServiceLoader from its own
        // classloader, so the postgres module must be on the buildscript classpath (not just the
        // project runtimeClasspath). Otherwise flywayMigrate fails with
        // "No Flyway database plugin found to handle jdbc:postgresql".
        classpath 'org.flywaydb:flyway-database-postgresql:11.14.1'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'nu.studer.jooq' version '9.0'
    id 'org.flywaydb.flyway' version '11.14.1'
}

apply from: '../gradle/java-base.gradle'
apply from: '../gradle/spotless.gradle'
apply from: '../gradle/boot-image.gradle'
apply from: '../gradle/observability.gradle'
apply from: '../gradle/jooq.gradle'

description = 'inventory-service'

ext {
    set('springCloudVersion', "2025.1.0")
    set('testcontainersVersion', "1.21.4")
}

spotless {
    java {
        targetExclude 'src/main/generated-jooq/**/*.java'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    runtimeOnly("io.netty:netty-resolver-dns-native-macos") {
        artifact {
            classifier = 'osx-aarch_64'
        }
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webflux-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:r2dbc'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    systemProperty 'user.timezone', 'UTC'
}

flyway {
    url = 'jdbc:postgresql://localhost:5434/polardb_inventory'
    user = 'user'
    password = 'password'
    baselineOnMigrate = true
}

jooq {
    version = '3.19.30'
    configurations {
        main {
            generateSchemaSourceOnCompilation = false
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5434/polardb_inventory'
                    user = 'user'
                    password = 'password'
                }
                generator {
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        includes = 'public.inventory|public.reservation|public.outbox_event'
                        inputSchema = 'public'
                    }
                    generate {
                        deprecated = false
                        records = true
                        pojos = false
                        fluentSetters = true
                        javaTimeTypes = true
                    }
                    target {
                        packageName = 'com.locpham.bookstore.inventoryservice.adapter.out.persistence.jooq.generated'
                        directory = 'src/main/generated-jooq'
                    }
                }
            }
        }
    }
}
