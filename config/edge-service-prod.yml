server:
  ssl:
    enabled: ${MTLS_ENABLED:false}
    client-auth: ${EDGE_MTLS_CLIENT_AUTH:none}
    key-store: ${MTLS_KEY_STORE:}
    key-store-password: ${MTLS_KEY_STORE_PASSWORD:}
    key-store-type: ${MTLS_KEY_STORE_TYPE:PKCS12}
    trust-store: ${MTLS_TRUST_STORE:}
    trust-store-password: ${MTLS_TRUST_STORE_PASSWORD:}
    trust-store-type: ${MTLS_TRUST_STORE_TYPE:PKCS12}

spring:
  data:
    redis:
      host: polar-redis
      port: 6379
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://polar-keycloak:8080}/realms/PolarBookshop
  cloud:
    config:
      bus:
        enabled: true
    gateway:
      httpclient:
        ssl:
          key-store: ${MTLS_KEY_STORE:}
          key-store-password: ${MTLS_KEY_STORE_PASSWORD:}
          key-store-type: ${MTLS_KEY_STORE_TYPE:PKCS12}
          trusted-x509-certificates: ${MTLS_TRUSTED_X509_CERTIFICATES:}
      server:
        webflux:
          default-filters:
            - SaveSession
            - TokenRelay
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${EDGE_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${EDGE_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: ${EDGE_RATE_LIMIT_REQUESTED_TOKENS:1}
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: spa-route
              uri: ${SPA_URL:http://polar-ui:9004}
              predicates:
                - Path=/,/*.css,/*.js,/favicon.ico
            - id: catalog-route
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:9001}
              predicates:
                - Path=/books,/books/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/catalog-fallback
            - id: order-route
              uri: ${ORDER_SERVICE_URL:http://order-service:9002}
              predicates:
                - Path=/orders,/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/order-fallback
            - id: inventory-route
              uri: ${INVENTORY_SERVICE_URL:http://inventory-service:9004}
              predicates:
                - Path=/inventory,/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/inventory-fallback
            - id: search-route
              uri: ${SEARCH_SERVICE_URL:http://search-service:9005}
              predicates:
                - Path=/search,/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: searchCircuitBreaker
                    fallbackUri: forward:/search-fallback
