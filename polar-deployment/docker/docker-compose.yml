services:
  config-service:
    depends_on:
      - grafana-alloy
      - tempo
      - polar-kafka
    image: "pxloc97/config-service:0.0.1-SNAPSHOT"
    container_name: "config-service"
    ports:
      - 8888:8888
      - 9888:9888
    environment:
      - SPRING_PROFILES_ACTIVE=native,prod
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/workspace/config
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=9888
      - BPL_JAVA_NMT_ENABLED=false
      - BPL_JVM_THREAD_COUNT=50
      - OTEL_SERVICE_NAME=config-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-alloy:4318
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/traces
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - OTEL_METRICS_EXPORTER=none
      - ENCRYPT_KEY=sharedkey
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=polar-kafka:19092
    volumes:
      - ../../config:/workspace/config:ro
    networks:
      - polar-network

  polar-mysql-catalog:
    image: "mysql:8.4"
    container_name: "polar-mysql-catalog"
    command: [
      "mysqld",
      "--server-id=1",
      "--log-bin=mysql-bin",
      "--binlog-format=ROW",
      "--binlog-row-image=FULL",
      "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON"
    ]
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=polardb_catalog
    networks:
      - polar-network

  polar-postgres-order:
    image: "postgres:13.4"
    container_name: "polar-postgres-order"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=polardb_order
    networks:
      - polar-network

  polar-postgres-inventory:
    image: "postgres:13.4"
    container_name: "polar-postgres-inventory"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=polardb_inventory
    networks:
      - polar-network

  polar-redis:
    image: "redis:6.2"
    container_name: "polar-redis"
    ports:
      - 6379:6379
    networks:
      - polar-network

  polar-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: polar-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - polar-network

  polar-kafka:
    image: apache/kafka:4.2.0
    hostname: polar-kafka
    container_name: polar-kafka
    user: "0:0"
    # Kafka was OOMKilled twice during 50-concurrency stress tests (exit 137).
    # Pin a 1g heap and a 1.5g cgroup limit so the broker has enough headroom for
    # in-flight produce batches plus PageCache usage under burst load.
    mem_limit: 1500m
    ports:
      - 9092:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1g
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@polar-kafka:29093
      - KAFKA_LISTENERS=CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT_HOST://localhost:9092,PLAINTEXT://polar-kafka:19092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
    networks:
      - polar-network

  polar-kafka-connect:
    image: debezium/connect:2.7.3.Final
    hostname: polar-kafka-connect
    container_name: polar-kafka-connect
    depends_on:
      - polar-kafka
      - polar-postgres-order
      - polar-postgres-inventory
      - polar-mysql-catalog
    ports:
      - 8083:8083
    environment:
      - BOOTSTRAP_SERVERS=polar-kafka:19092
      - GROUP_ID=bookstore-connect
      - CONFIG_STORAGE_TOPIC=connect-configs
      - OFFSET_STORAGE_TOPIC=connect-offsets
      - STATUS_STORAGE_TOPIC=connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
    volumes:
      - ./connect:/bookstore-connectors:ro
    networks:
      - polar-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - 8085:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=polar-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=polar-kafka:19092
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=polar-kafka-connect
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://polar-kafka-connect:8083
    depends_on:
      - polar-kafka
      - polar-kafka-connect
    networks:
      - polar-network

  polar-postgres-keycloak:
    image: "postgres:16-alpine"
    container_name: "polar-postgres-keycloak"
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=keycloakdb
    networks:
      - polar-network

  polar-keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: polar-keycloak
    depends_on:
      - polar-postgres-keycloak
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=user
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_HOSTNAME_STRICT=false
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://polar-postgres-keycloak:5432/keycloakdb
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm.json
    ports:
      - 8080:8080
    networks:
      - polar-network

  grafana:
    image: grafana/grafana:10.4.7
    container_name: grafana
    depends_on:
      - loki
      - mimir
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: user
      GF_SECURITY_ADMIN_PASSWORD: password
    volumes:
      - ./platform/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./platform/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./platform/grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - polar-network

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - polar-network

  mimir:
    image: grafana/mimir:2.14.3
    container_name: mimir
    command: ["-config.file=/etc/mimir/mimir.yml"]
    ports:
      - "9009:9009"
    volumes:
      - ./platform/mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data:/data
    networks:
      - polar-network

  grafana-alloy:
    image: grafana/alloy:v1.1.0
    container_name: grafana-alloy
    depends_on:
      - loki
      - tempo
      - mimir
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./platform/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - polar-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: -config.file=/etc/tempo-config.yml
    ports:
      - "3110:3100"
    volumes:
      - ./platform/tempo/tempo.yml:/etc/tempo-config.yml
    networks:
      - polar-network

volumes:
  kafka_data:
    driver: local
  elasticsearch_data:
    driver: local
  mimir_data:
    driver: local

networks:
  polar-network:
    name: polar-network
