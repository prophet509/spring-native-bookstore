apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9001"
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: pxloc97/catalog-service:0.0.1-SNAPSHOT
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 9001
          env:
            - name: BPL_JAVA_NMT_ENABLED
              value: "false"
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: OTEL_SERVICE_NAME
              value: "catalog-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/traces"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "polar-kafka:19092"
            - name: REDIS_HOST
              value: "polar-redis"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://polar-postgres:5432/polardb_catalog"
            - name: SPRING_DATASOURCE_USERNAME
              value: "user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-service"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://polar-keycloak:8080/realms/PolarBookshop"
            - name: MTLS_ENABLED
              value: "false"
            - name: MTLS_KEY_STORE
              value: "/etc/mtls/keystore.p12"
            - name: MTLS_KEY_STORE_PASSWORD
              value: ""
            - name: MTLS_KEY_STORE_TYPE
              value: "PKCS12"
            - name: MTLS_TRUST_STORE
              value: "/etc/mtls/truststore.p12"
            - name: MTLS_TRUST_STORE_PASSWORD
              value: ""
            - name: MTLS_TRUST_STORE_TYPE
              value: "PKCS12"
            - name: BACKEND_MTLS_CLIENT_AUTH
              value: "need"
          volumeMounts:
            - name: catalog-service-volume
              mountPath: /workspace/config
            - name: catalog-service-volume-secret
              mountPath: /workspace/secrets/catalog-service
              readOnly: true
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: catalog-service-volume
          configMap:
            name: catalog-service
        - name: catalog-service-volume-secret
          secret:
            secretName: catalog-service
        - name: mtls-certs
          secret:
            secretName: catalog-service-mtls-certs
            optional: true
