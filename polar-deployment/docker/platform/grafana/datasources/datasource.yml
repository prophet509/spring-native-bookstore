apiVersion: 1

deleteDatasources:
  - name: Prometheus
  - name: Mimir
  - name: Tempo
  - name: Loki

datasources:
  - name: Mimir
    type: prometheus
    uid: mimir-pxloc
    access: proxy
    orgId: 1
    url: http://mimir:9009/prometheus
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
  - name: Tempo
    type: tempo
    uid: tempo-pxloc-vitale
    access: proxy
    orgId: 1
    url: http://tempo:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'loki-pxloc-vitale'
        tags: [ 'instance', 'pod', 'namespace', 'hostname' ]
        mappedTags: [ { key: 'service.name', value: 'application' }  ]
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        lokiSearch: true
      lokiSearch:
        datasourceUid: 'loki-pxloc-vitale'
      serviceMap:
        datasourceUid: 'mimir-pxloc'
      search:
        hide: false
      nodeGraph:
        enabled: true
  - name: Loki
    type: loki
    uid: loki-pxloc-vitale
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: tempo-pxloc-vitale
          matcherRegex: '"traceId":"([^"]+)"'
          name: TraceID
          url: $${__value.raw}
