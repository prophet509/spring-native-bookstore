apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9002"
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: pxloc97/order-service:0.0.1-SNAPSHOT
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 9002
          env:
            - name: BPL_JAVA_NMT_ENABLED
              value: "false"
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxDirectMemorySize=128M -XX:+AlwaysPreTouch -XX:MaxGCPauseMillis=50 -XX:+UseStringDeduplication"
            - name: OTEL_SERVICE_NAME
              value: "order-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/traces"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: POLAR_CATALOG_SERVICE_URL
              value: "http://catalog-service"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-service"
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://polar-postgres-order/polardb_order"
            - name: SPRING_FLYWAY_URL
              value: "jdbc:postgresql://polar-postgres-order/polardb_order"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "polar-kafka:19092"
            - name: REDIS_HOST
              value: "polar-redis"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://polar-keycloak:8080/realms/PolarBookshop"
            - name: MTLS_ENABLED
              value: "false"
            - name: MTLS_KEY_STORE
              value: "/etc/mtls/keystore.p12"
            - name: MTLS_KEY_STORE_PASSWORD
              value: ""
            - name: MTLS_KEY_STORE_TYPE
              value: "PKCS12"
            - name: MTLS_TRUST_STORE
              value: "/etc/mtls/truststore.p12"
            - name: MTLS_TRUST_STORE_PASSWORD
              value: ""
            - name: MTLS_TRUST_STORE_TYPE
              value: "PKCS12"
            - name: BACKEND_MTLS_CLIENT_AUTH
              value: "need"
            - name: ORDER_HTTP_CLIENT_MTLS_ENABLED
              value: "false"
            - name: POLAR_HTTP_CLIENT_MTLS_ENABLED
              value: "false"
            - name: POLAR_HTTP_CLIENT_MTLS_KEY_STORE
              value: "/etc/mtls/keystore.p12"
            - name: POLAR_HTTP_CLIENT_MTLS_KEY_STORE_PASSWORD
              value: ""
            - name: POLAR_HTTP_CLIENT_MTLS_KEY_STORE_TYPE
              value: "PKCS12"
            - name: POLAR_HTTP_CLIENT_MTLS_TRUST_STORE
              value: "/etc/mtls/truststore.p12"
            - name: POLAR_HTTP_CLIENT_MTLS_TRUST_STORE_PASSWORD
              value: ""
            - name: POLAR_HTTP_CLIENT_MTLS_TRUST_STORE_TYPE
              value: "PKCS12"
          volumeMounts:
            - name: order-service-volume
              mountPath: /workspace/config
            - name: order-service-volume-secret
              mountPath: /workspace/secrets/order-service
              readOnly: true
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: order-service-volume
          configMap:
            name: order-service
        - name: order-service-volume-secret
          secret:
            secretName: order-service
        - name: mtls-certs
          secret:
            secretName: order-service-mtls-certs
            optional: true
