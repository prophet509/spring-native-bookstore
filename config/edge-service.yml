server:
  port: 9000
  netty:
    connection-timeout: 2s
  shutdown: graceful

spring:
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 500ms
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: polar:edge
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: edge-service
            client-authentication-method: none
            authorization-grant-type: authorization_code
            scope: openid,roles
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/PolarBookshop
  cloud:
    config:
      bus:
        enabled: false
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
            - TokenRelay
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: spa-route
              uri: ${SPA_URL:http://localhost:9004}
              predicates:
                - Path=/,/*.css,/*.js,/favicon.ico
            - id: catalog-route
              uri: ${CATALOG_SERVICE_URL:http://localhost:9001}
              predicates:
                - Path=/books,/books/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/catalog-fallback
                - SetResponseHeader=Cache-Control, public, max-age=30
            - id: order-route
              uri: ${ORDER_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/orders,/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/order-fallback
            - id: inventory-route
              uri: ${INVENTORY_SERVICE_URL:http://localhost:9004}
              predicates:
                - Path=/inventory,/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/inventory-fallback
            - id: search-route
              uri: ${SEARCH_SERVICE_URL:http://localhost:9005}
              predicates:
                - Path=/search,/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: searchCircuitBreaker
                    fallbackUri: forward:/search-fallback
                - SetResponseHeader=Cache-Control, public, max-age=30

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        permitted-number-of-calls-in-half-open-state: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1500
      cache:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        slow-call-duration-threshold: 300ms
        slow-call-rate-threshold: 80
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
      cache:
        timeout-duration: 300ms
      origin:
        timeout-duration: 2s
  retry:
    configs:
      transient:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
