apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-mysql
  labels:
    db: polar-mysql
spec:
  selector:
    matchLabels:
      db: polar-mysql
  template:
    metadata:
      labels:
        db: polar-mysql
    spec:
      containers:
        - name: polar-mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: password
            - name: MYSQL_USER
              value: user
            - name: MYSQL_PASSWORD
              value: password
            - name: MYSQL_DATABASE
              value: polardb_catalog
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

---

apiVersion: v1
kind: Service
metadata:
  name: polar-mysql
  labels:
    db: polar-mysql
spec:
  type: ClusterIP
  selector:
    db: polar-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
