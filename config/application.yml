management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info, prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
          compression: none
        schedule-delay: 5s
        timeout: 30s
  otlp:
    metrics:
      export:
        enabled: false

spring:
  kafka:
    listener:
      observation-enabled: true
