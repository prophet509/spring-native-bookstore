services:
  catalog-service:
    image: "pxloc97/catalog-service:0.0.1-SNAPSHOT"
    container_name: "catalog-service"
    ports:
      - 8001:8001
      - 9001:9001
    environment:
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8001
      - BPL_JAVA_NMT_ENABLED=false
      - BPL_JVM_THREAD_COUNT=50
      - OTEL_SERVICE_NAME=catalog-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-alloy:4318
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/traces
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - OTEL_METRICS_EXPORTER=none
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://user:password@config-service:8888
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=30
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=5000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=polar-kafka:19092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://polar-postgres-catalog:5432/polardb_catalog
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://polar-keycloak:8080/realms/PolarBookshop
    labels:
      service_name: catalog-service
    networks:
      - polar-network

  order-service:
    image: "pxloc97/order-service:0.0.1-SNAPSHOT"
    container_name: "order-service"
    mem_limit: 1200m
    ports:
      - 8002:8002
      - 9002:9002
    environment:
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8002
      - BPL_JAVA_NMT_ENABLED=false
      - BPL_JVM_THREAD_COUNT=50
      # WebFlux/Netty serves I/O via direct buffers; the Paketo memory calculator's 10M default
      # causes "Cannot reserve ... direct buffer memory" OOM under load. Override it (appended after
      # the calculated value, so it wins). mem_limit pins the calculator's budget so heap is stable.
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=128M
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-alloy:4318
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/traces
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - OTEL_METRICS_EXPORTER=none
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://user:password@config-service:8888
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=30
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=5000
      - SPRING_R2DBC_URL=r2dbc:postgresql://polar-postgres-order:5432/polardb_order
      - SPRING_FLYWAY_URL=jdbc:postgresql://polar-postgres-order:5432/polardb_order
      - POLAR_CATALOG_SERVICE_URL=http://catalog-service:9001
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=polar-kafka:19092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://polar-keycloak:8080/realms/PolarBookshop
    labels:
      service_name: order-service
    networks:
      - polar-network

  inventory-service:
    image: "pxloc97/inventory-service:0.0.1-SNAPSHOT"
    container_name: "inventory-service"
    mem_limit: 1200m
    ports:
      - 8005:8005
      - 9004:9004
    environment:
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8005
      - BPL_JAVA_NMT_ENABLED=false
      - BPL_JVM_THREAD_COUNT=50
      # WebFlux/Netty serves I/O via direct buffers; the Paketo memory calculator's 10M default
      # causes "Cannot reserve ... direct buffer memory" OOM under load. Override it (appended after
      # the calculated value, so it wins). mem_limit pins the calculator's budget so heap is stable.
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=128M
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-alloy:4318
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/traces
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - OTEL_METRICS_EXPORTER=none
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://user:password@config-service:8888
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=30
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=5000
      - SPRING_R2DBC_URL=r2dbc:postgresql://polar-postgres-inventory:5432/polardb_inventory
      - SPRING_FLYWAY_URL=jdbc:postgresql://polar-postgres-inventory:5432/polardb_inventory
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=polar-kafka:19092
    labels:
      service_name: inventory-service
    networks:
      - polar-network

  dispatcher-service:
    image: "pxloc97/dispatcher-service:0.0.1-SNAPSHOT"
    container_name: "dispatcher-service"
    ports:
      - 9003:9003
      - 8003:8003
    environment:
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8003
      - BPL_JAVA_NMT_ENABLED=false
      - BPL_JVM_THREAD_COUNT=50
      - OTEL_SERVICE_NAME=dispatcher-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-alloy:4318
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/traces
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://grafana-alloy:4318/v1/logs
      - OTEL_METRICS_EXPORTER=none
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://user:password@config-service:8888
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=30
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=5000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=polar-kafka:19092
