apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-service
  labels:
    app: dispatcher-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatcher-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9003"
      labels:
        app: dispatcher-service
    spec:
      containers:
        - name: dispatcher-service
          image: pxloc97/dispatcher-service:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 9003
          env:
            - name: BPL_JAVA_NMT_ENABLED
              value: "false"
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: OTEL_SERVICE_NAME
              value: "dispatcher-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/traces"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-service"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "polar-kafka:19092"
            - name: MTLS_ENABLED
              value: "false"
            - name: MTLS_KEY_STORE
              value: "/etc/mtls/keystore.p12"
            - name: MTLS_KEY_STORE_PASSWORD
              value: ""
            - name: MTLS_KEY_STORE_TYPE
              value: "PKCS12"
            - name: MTLS_TRUST_STORE
              value: "/etc/mtls/truststore.p12"
            - name: MTLS_TRUST_STORE_PASSWORD
              value: ""
            - name: MTLS_TRUST_STORE_TYPE
              value: "PKCS12"
            - name: BACKEND_MTLS_CLIENT_AUTH
              value: "need"
          volumeMounts:
            - name: dispatcher-service-volume
              mountPath: /workspace/config
            - name: dispatcher-service-volume-secret
              mountPath: /workspace/secrets/dispatcher-service
              readOnly: true
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: dispatcher-service-volume
          configMap:
            name: dispatcher-service
        - name: dispatcher-service-volume-secret
          secret:
            secretName: dispatcher-service
        - name: mtls-certs
          secret:
            secretName: dispatcher-service-mtls-certs
            optional: true
