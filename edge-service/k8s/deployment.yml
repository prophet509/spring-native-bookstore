apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
  labels:
    app: edge-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9000"
      labels:
        app: edge-service
    spec:
      containers:
        - name: edge-service
          image: pxloc97/edge-service:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - containerPort: 9000
          env:
            - name: BPL_JAVA_NMT_ENABLED
              value: "false"
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: OTEL_SERVICE_NAME
              value: "edge-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/traces"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana-alloy:4318/v1/logs"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-service"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "polar-kafka:19092"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:9002"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:9004"
            - name: SEARCH_SERVICE_URL
              value: "http://search-service:9005"
            - name: SPA_URL
              value: "http://polar-ui"
            - name: SPRING_REDIS_HOST
              value: "polar-redis"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://polar-keycloak:8080/realms/PolarBookshop"
            - name: MTLS_ENABLED
              value: "false"
            - name: MTLS_KEY_STORE
              value: "/etc/mtls/keystore.p12"
            - name: MTLS_KEY_STORE_PASSWORD
              value: ""
            - name: MTLS_KEY_STORE_TYPE
              value: "PKCS12"
            - name: MTLS_TRUST_STORE
              value: "/etc/mtls/truststore.p12"
            - name: MTLS_TRUST_STORE_PASSWORD
              value: ""
            - name: MTLS_TRUST_STORE_TYPE
              value: "PKCS12"
            - name: EDGE_MTLS_CLIENT_AUTH
              value: "none"
          volumeMounts:
            - name: edge-service-volume
              mountPath: /workspace/config
            - name: edge-service-volume-secret
              mountPath: /workspace/secrets/edge-service
              readOnly: true
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
      volumes:
        - name: edge-service-volume
          configMap:
            name: edge-service
        - name: edge-service-volume-secret
          secret:
            secretName: edge-service
        - name: mtls-certs
          secret:
            secretName: edge-service-mtls-certs
            optional: true
