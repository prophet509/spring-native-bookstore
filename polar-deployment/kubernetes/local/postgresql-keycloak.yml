apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-postgres-keycloak
  labels:
    db: polar-postgres-keycloak
spec:
  selector:
    matchLabels:
      db: polar-postgres-keycloak
  template:
    metadata:
      labels:
        db: polar-postgres-keycloak
    spec:
      containers:
        - name: polar-postgres-keycloak
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: keycloakdb
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

---

apiVersion: v1
kind: Service
metadata:
  name: polar-postgres-keycloak
  labels:
    db: polar-postgres-keycloak
spec:
  type: ClusterIP
  selector:
    db: polar-postgres-keycloak
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
