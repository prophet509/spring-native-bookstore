apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app: edge-service

resources:
  - deployment.yml
  - service.yml
  - ingress.yml

configMapGenerator:
  - name: edge-service
    files:
      - application.yml
    options:
      disableNameSuffixHash: true
      labels:
        spring.cloud.kubernetes.config: "true"

secretGenerator:
  - name: edge-service
    literals:
      - spring.cloud.config.username=user
      - spring.cloud.config.password=password
    options:
      disableNameSuffixHash: true
      labels:
        spring.cloud.kubernetes.secret: "true"
  - name: edge-service-mtls-certs
    files:
      - keystore.p12=certs/keystore.p12
      - truststore.p12=certs/truststore.p12
    options:
      disableNameSuffixHash: true
